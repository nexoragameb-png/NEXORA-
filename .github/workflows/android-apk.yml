name: Android APK

on:
  push:
    branches: [main, menu-rebuild-v3]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle properties
        run: |
          {
            echo ""   # prebuild leaves gradle.properties without a trailing newline
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a"
          } >> android/gradle.properties

      # Optional real release signing. Add these repository secrets to sign with your own upload key:
      #   ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the release build is signed with the debug keystore (installable for testing, not for Play upload).
      - name: Release signing (only when secrets are configured)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing secrets: using the debug keystore"; echo "SIGNED=debug" >> $GITHUB_ENV; exit 0; fi
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          {
            echo "NEXORA_UPLOAD_STORE_FILE=upload.jks"
            echo "NEXORA_UPLOAD_STORE_PASSWORD=$KS_PASS"
            echo "NEXORA_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "NEXORA_UPLOAD_KEY_PASSWORD=$KEY_PASS"
          } >> android/gradle.properties
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  upload {
                      storeFile file(NEXORA_UPLOAD_STORE_FILE)
                      storePassword NEXORA_UPLOAD_STORE_PASSWORD
                      keyAlias NEXORA_UPLOAD_KEY_ALIAS
                      keyPassword NEXORA_UPLOAD_KEY_PASSWORD
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
          echo "SIGNED=upload" >> $GITHUB_ENV

      - name: Build release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/*.apk "dist-apk/nexora-${{ github.run_number }}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist-apk/nexora-${{ github.run_number }}.aab"
          ls -la dist-apk
          echo "Signed with: ${SIGNED:-debug}"

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-aab
          path: dist-apk/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NEXORA build ${{ github.run_number }}
          body: |
            Test build of NEXORA (release APK signed with the debug keystore).
            Commit: ${{ github.sha }}
            Install: download the APK on your Android phone and allow "install unknown apps".
          files: |
            dist-apk/*.apk
            dist-apk/*.aab
          make_latest: true
